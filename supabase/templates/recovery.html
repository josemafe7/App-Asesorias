<h2>Pon una contraseña nueva</h2>

<p>Alguien ha pedido cambiar la contraseña de tu cuenta de Carpeta Fiscal. Si has sido tú, entra por este enlace y elige una nueva:</p>

<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery">Poner una contraseña nueva</a></p>

<p>El enlace caduca y solo sirve una vez. Si no lo has pedido tú, no hagas nada: tu contraseña sigue siendo la misma.</p>
